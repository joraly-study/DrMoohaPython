version: '3.8'

services:
  web:
    build: .
    volumes:
      - ./drmooha:/app/drmooha
      - ./mooha:/app/mooha
      - ./manage.py:/app/manage.py
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5430/drmooha
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=drmooha
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5430:5432"

volumes:
  postgres_data:
  static_volume:
  media_volume: 